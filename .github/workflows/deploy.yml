name: Build and Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # VITE_ vars are baked into the client bundle at build time.
      # VITE_MSAL_TENANT_ID must be added as a GitHub secret if not already present.
      - name: Build all workspaces
        env:
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ secrets.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_REDIRECT_URI: ${{ secrets.VITE_MSAL_REDIRECT_URI }}
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Zip artifact for deployment
        run: zip -r release.zip . --exclude ".git/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FCD2F2944A1F49C5B6F219652DC8A3A3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_780DFCA6331F41D4BDCD8DD89FE4BE69 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A89E3EFE3BD448C5BD9A206C1FE065F3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'YOUR_APP_NAME'  # TODO: replace with your Azure App Service name
          package: release.zip
          startup-command: 'node server/dist/app.js'
