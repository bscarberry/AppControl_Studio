# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - appcontrolstudio

on:
  push:
    branches:
      - claude/wdac-policy-management-app-L2eDm
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # VITE_ vars are baked into the client bundle at build time.
      # VITE_MSAL_TENANT_ID must be added as a GitHub secret if not already present.
      - name: Build all workspaces
        env:
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ secrets.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_REDIRECT_URI: ${{ secrets.VITE_MSAL_REDIRECT_URI }}
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Zip artifact for deployment
        run: zip -r release.zip . --exclude ".git/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FCD2F2944A1F49C5B6F219652DC8A3A3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_780DFCA6331F41D4BDCD8DD89FE4BE69 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A89E3EFE3BD448C58D9A206C1FE065F3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'appcontrolstudio'
          slot-name: 'Production'
          package: release.zip
          startup-command: 'node server/dist/app.js'
